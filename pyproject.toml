# >=1.9 for PEP 639 license metadata (SPDX `license` string + `license-files`).
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "frostwork"
version = "0.1.0"
description = "Treeless, one-pass HTML extraction — CSS/XPath selectors matched on a streaming scan, no DOM."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Zyte" }]
keywords = ["html", "scraping", "css-selectors", "xpath", "streaming", "web-poet", "scrapy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

# The web-poet page-object integration (`frostwork.webpoet`) is optional; the core
# (`frostwork.extract`, `frostwork.Page`) needs nothing but the compiled extension.
#
# The floor is the version the integration is actually TESTED against — the pin in
# `requirements-test.txt`, restated as `frostwork.webpoet._MIN_WEB_POET` so the import error can name it.
# It was `>=0.8`, which was a guess and a wrong one: the integration imports `Extractor`/`ItemPage`,
# `cached_method` and `web_poet.fields.get_fields_dict`, and resolves processors the way
# `web_poet.fields.field.__get__` does, so a declared-compatible-but-untested release either fails to
# import or, worse, resolves processors differently. Nothing here gates any other version, so nothing
# here should claim one.
#
# NOTE this extra is narrower than Frostwork's own `requires-python = ">=3.9"`: web-poet 0.24.1 requires
# Python >= 3.10, so `pip install frostwork[webpoet]` needs 3.10+ even though the core does not. The core
# is what the 3.9 classifier is about; see docs/PYTHON.md.
[project.optional-dependencies]
webpoet = ["web-poet>=0.24.1"]

# Static schema-audit CLI: `frostwork-audit path/to/pageobjects.py` (or `python -m frostwork.audit`).
[project.scripts]
frostwork-audit = "frostwork.audit:main"

[project.urls]
Homepage = "https://github.com/shaneaevans/frostwork"
Repository = "https://github.com/shaneaevans/frostwork"
Documentation = "https://github.com/shaneaevans/frostwork#readme"
Issues = "https://github.com/shaneaevans/frostwork/issues"

# The package ships `py.typed`, so its annotations are a promise to every user's type checker.
# `make py` and CI run `mypy python/frostwork tests/typing_fixture.py`; `tests/test_typing.py` additionally
# asserts the check can go RED, since a type check that passes regardless of the annotations proves nothing.
[tool.mypy]
files = ["python/frostwork", "tests/typing_fixture.py"]

# lxml is an OPTIONAL, lazily-imported dependency — reached only when a field processor is attached to a
# bare-element field (see `frostwork.webpoet._as_node`). It ships no stubs of its own and `lxml-stubs` is
# incomplete, so requiring it would make an optional dep mandatory for anyone type-checking this package.
[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true

[tool.maturin]
# Mixed Rust/Python project: pure-Python package lives under python/, the compiled core is dropped
# in as frostwork._frostwork. `--features python` turns on the pyo3 bindings (off for cargo test).
features = ["python"]
module-name = "frostwork._frostwork"
python-source = "python"
