name: release

# Build abi3 wheels (one per platform, CPython >= 3.9) + an sdist, and publish to PyPI on a version
# tag. Publishing uses PyPI Trusted Publishing (OIDC) — no API token stored: configure this repo +
# workflow as a trusted publisher for the `frostwork` project on PyPI, then push a tag (e.g. `v0.1.0`).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: build/install the actual sdist and run the Python suite
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install --no-build-isolation dist/*.tar.gz
          python -m pytest tests/test_python.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  smoke:
    # Install the ACTUAL built wheel on each platform and run the Python suite against it, so we never
    # publish a wheel that hasn't been imported + exercised end-to-end (the build succeeding is not
    # the same as the wheel working). `publish` needs this.
    name: smoke-test built wheel
    needs: [linux, macos, windows, sdist]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, artifact: wheels-linux-x86_64 }
          - { os: macos-latest, artifact: wheels-macos-aarch64 }
          - { os: windows-latest, artifact: wheels-windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: install the built wheel + test deps, then run the suite
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip install --no-index --find-links dist frostwork
          python -m pytest tests/test_python.py -q

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist, smoke]
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
