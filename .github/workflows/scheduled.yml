name: scheduled

# The two gates docs/RELEASING.md asks for before a tag and `ci.yml` cannot afford per pull request:
# the multi-million-pair soak and the full rule-mutation sweep (~1700 mutants). Running them weekly
# makes preparing a release candidate a matter of reading the last run instead of an hour of local
# waiting. `corpus-real` is deliberately absent: it fetches live third-party pages, so a release gate
# built on it would depend on thirty other people's servers being up.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    name: multi-million-pair soak
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      # the same pinned oracle the gates use: an lxml/parsel upgrade must be a deliberate bump.
      - run: .venv/bin/pip install -r requirements-test.txt
      - run: make soak

  mutate:
    name: full rule-mutation sweep (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    # Every rule cell, one mutant per run of the fast detectors. The sampled form in `make ci` answers
    # the same question over 40 of them. Serially the sweep outlasts the 6-hour job limit, so each job
    # takes every 8th mutant.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-test.txt
      - run: make gate-mutate-full SHARD=${{ matrix.shard }}/8
