name: publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Release metadata and tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Release validation proves the annotated tag is contained in origin/main.
          fetch-depth: 0
      - name: validate source metadata
        run: python tools/release_check.py
      - name: validate immutable release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          python tools/release_check.py --tag "$GITHUB_REF_NAME"
          --require-annotated-tag --require-main

  # A tag can point at any commit, so branch CI alone is not a release gate. Reuse the exact workflow
  # pull requests run; a second hand-written checklist would drift from `make ci` again.
  quality:
    name: Complete correctness workflow
    uses: ./.github/workflows/ci.yml

  linux:
    name: wheel (linux ${{ matrix.platform.target }} ${{ matrix.platform.libc }})
    needs: [preflight, quality]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64, libc: manylinux, manylinux: auto }
          - { runner: ubuntu-latest, target: x86, libc: manylinux, manylinux: auto }
          - { runner: ubuntu-24.04-arm, target: aarch64, libc: manylinux, manylinux: auto }
          - { runner: ubuntu-latest, target: armv7, libc: manylinux, manylinux: auto }
          - { runner: ubuntu-latest, target: ppc64le, libc: manylinux, manylinux: auto }
          - { runner: ubuntu-latest, target: riscv64, libc: manylinux, manylinux: auto }
          - { runner: ubuntu-latest, target: x86_64, libc: musllinux, manylinux: musllinux_1_2 }
          - { runner: ubuntu-24.04-arm, target: aarch64, libc: musllinux, manylinux: musllinux_1_2 }
          - { runner: ubuntu-latest, target: armv7, libc: musllinux, manylinux: musllinux_1_2 }
          - { runner: ubuntu-latest, target: ppc64le, libc: musllinux, manylinux: musllinux_1_2 }
          - { runner: ubuntu-latest, target: riscv64, libc: musllinux, manylinux: musllinux_1_2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: ${{ matrix.platform.manylinux }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.platform.libc }}-${{ matrix.platform.target }}
          path: dist

  macos:
    name: wheel (macos ${{ matrix.target }})
    needs: [preflight, quality]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    name: wheel (windows ${{ matrix.platform.target }})
    needs: [preflight, quality]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: windows-latest, target: x64, arch: x64 }
          - { runner: windows-latest, target: x86, arch: x86 }
          - { runner: windows-11-arm, target: aarch64, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.platform.arch }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: sdist
    needs: [preflight, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: build/install the actual sdist and run the Python suite
        run: |
          python -m pip install -r requirements-test.txt -r requirements-release.txt
          python -m twine check --strict dist/*.tar.gz
          python tools/release_check.py --distribution dist/*.tar.gz
          python -m pip install --no-build-isolation dist/*.tar.gz
          python -m pytest tests/test_python.py -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  smoke:
    name: smoke-test built wheel (${{ matrix.artifact }})
    needs: [linux, macos, windows, sdist]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, artifact: wheels-manylinux-x86_64 }
          - { os: ubuntu-24.04-arm, artifact: wheels-manylinux-aarch64 }
          - { os: macos-latest, artifact: wheels-macos-aarch64 }
          - { os: windows-latest, artifact: wheels-windows-x64 }
          - { os: windows-11-arm, artifact: wheels-windows-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: install the built wheel + test deps, then run the suite
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt -r requirements-release.txt
          python -m twine check --strict dist/*.whl
          python tools/release_check.py --distribution dist/*.whl
          python -m pip install --no-index --find-links dist frostwork
          python -m pytest tests/test_python.py -q

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist, smoke]
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/frostwork
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  verify:
    name: Verify public PyPI release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Fetch the public JSON metadata, install the wheel from pypi.org (not this run's artifact), and
      # execute one extraction. A successful upload is not yet proof that users can install it.
      - run: python tools/verify_pypi.py "$GITHUB_REF_NAME"

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: take release notes from the changelog
        run: python tools/release_check.py --notes-for "$GITHUB_REF_NAME" > release-notes.md
      - name: create the release after PyPI is verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Frostwork $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
