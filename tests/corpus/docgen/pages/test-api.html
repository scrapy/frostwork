<h1>API reference<a class="headerlink" href="#api">¶</a></h1>
<p>The primitive is <code>extract</code>.</p>
</p>
<p>It takes bytes and a list of selectors.</p>
</p>
<dl class="py function">
<dt id="frostwork.extract">frostwork.<span class="name">extract</span><span class="sig">(html, queries)</span>
<dt id="frostwork.extract.alias">frostwork.<span class="name">extract_grouped</span><span class="sig">(html, queries, groups)</span>
<dd><p>Return one value column per query.</p>
<div class="admonition note"><p class="admonition-title">Note</p>
<p>Unsupported selectors raise by default.</p></div></dd>
</dl>
<pre><code>cols = extract(html, ["h1::text"])  # &lt;- one pass</code></pre>
